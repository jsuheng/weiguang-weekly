services:
  app:
    image: harbor.zlpv.com/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}:${CI_COMMIT_SHA:-latest}
    container_name: weiguang-app
    ports:
      - "7019:3000"
    volumes:
      - /data/weiguang/files:/data/files
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - weiguang-weekly
    depends_on:
      - postgres

  postgres:
    image: postgres:17-alpine
    container_name: weiguang-postgres
    volumes:
      - /data/weiguang/postgres:/var/lib/postgresql/data
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - weiguang-weekly

  reminder:
    image: alpine:3.21
    container_name: weiguang-reminder
    command: sh -c "while true; do wget -qO- --post-data='' http://app:3000/api/internal/reminders/run || true; sleep 600; done"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - weiguang-weekly
    depends_on:
      - app

networks:
  weiguang-weekly:
